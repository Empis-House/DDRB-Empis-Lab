services:
  world-gen-api:
    image: ddrb-empis-lab/world-gen-api:${WORLD_GEN_API_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: world_generation/dockerfile
      args:
        APP_VERSION: ${WORLD_GEN_API_VERSION:-1.0.0}
    ports:
      - "8000:8000"
    command: ["uvicorn", "world_generation.API:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./world_generation:/app/world_generation
      - ./Super_Mario_Brothers_Maps:/app/Super_Mario_Brothers_Maps
      - ./history:/app/history
      - ./checkpoints:/app/checkpoints
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
